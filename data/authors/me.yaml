bio: |-
  My research focuses on **Security for AI**, with particular interests in **Mechanistic Interpretability**, **LLM & Agent Security**, and **Trustworthy Multimodal AI**. I am interested in how internal representations shape model behavior and how interpretability can inform the evaluation and mitigation of unsafe or adversarial behavior. Drawing on my cybersecurity background at Ajou University, I approach these questions through empirical analysis of AI models and a systems security perspective.

  In **VLM-CAST**, I analyzed model responses and internal activations under different image–text conditions. In **VXShield**, I worked on an experimental pipeline for protecting speech against voice cloning, evaluating audio quality, speaker similarity, speech recognition performance, and cross-model robustness. During the **11th Best of the Best (BoB) program’s Security Consulting track**, I led a five-person team investigating UEFI vulnerabilities. Across these projects, I emphasize reproducible experiments, clear evaluation criteria, and careful analysis of failure cases.
