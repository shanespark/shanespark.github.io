hugoblox:
  meta:
    format: hugoblox-theme@1
    name: Athenaeum
    vendor: shanespark
    version: 1.0.0
    license: MIT
  type: dual
  light:
    colors:
      primary: '#263b55'
      secondary: '#9b783b'
    surfaces:
      background: '#f8f6f1'
      foreground: '#222b38'
