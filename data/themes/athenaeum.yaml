        background: '#f8f6f1'
        foreground: '#222b38'
      footer:
        background: '#f8f6f1'
        foreground: '#616771'
  dark:
    colors:
      primary: '#d4b676'
      secondary: '#93adcc'
    surfaces:
      background: '#0c1220'
      foreground: '#e9e5dc'
      header:
        background: '#0c1220'
        foreground: '#e9e5dc'
      footer:
        background: '#0c1220'
        foreground: '#a1aabc'
