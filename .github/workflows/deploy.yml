name: Initialize and deploy Athenaeum
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Import prepared website source
        if: hashFiles('athenaeum-native-source.zip') != ''
        run: |
          set -euo pipefail
          python3 - <<'IMPORT'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          p = Path('athenaeum-native-source.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '67086140869cb450ccf79ad8c96797e248befcd0aef4febe9ea960c7d61e16e7', 'Source checksum mismatch'
          with zipfile.ZipFile(p) as archive:
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in ('.git', '.github')
              archive.extractall('.')
          IMPORT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm athenaeum-native-source.zip
          git add --all
          git commit -m "Apply HugoBlox Academic CV for Shane's Athenaeum"
          git push origin HEAD:main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
          run_install: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
        env:
          HUGO_ENVIRONMENT: production
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
