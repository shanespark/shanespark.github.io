{{ $ga := site.Params.hugoblox.analytics.google.measurement_id | default "" }}
{{ if $ga }}
  {{ if not (findRE `^G-[A-Z0-9]+$` $ga) }}{{ errorf "Invalid GA4 measurement ID" }}{{ end }}
  {{ with resources.Get "js/athenaeum-analytics.js" | minify | fingerprint "sha256" }}
<script defer src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" data-athenaeum-analytics data-measurement-id="{{ $ga }}" data-production="{{ hugo.IsProduction }}" data-site-origin="{{ site.BaseURL | strings.TrimSuffix "/" }}"></script>
  {{ end }}
<style>
  .analytics-notice[hidden] { display: none; }
  .analytics-notice { position: fixed; z-index: 60; bottom: 1.25rem; right: 1.25rem; width: min(26rem, calc(100% - 2.5rem)); padding: 1.25rem; border: 1px solid #d4d5d5; border-radius: 6px; background: #f8f6f1; color: #222b38; box-shadow: 0 8px 32px #0000001a; font-family: ui-sans-serif, system-ui, sans-serif; font-size: .875rem; line-height: 1.6; }
  .analytics-notice h2 { margin: 0 0 .5rem; font-family: inherit; font-size: 1rem; font-weight: 600; }
  .analytics-notice p { margin: 0; }
  .analytics-notice a { text-decoration: underline; text-underline-offset: 3px; }
  .analytics-choice { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
  .analytics-choice button { flex: 1; padding: .55rem .75rem; border: 1px solid #263b5540; border-radius: 4px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  .analytics-choice button:hover { background: #263b550c; }
  .analytics-choice button:focus-visible, [data-open-analytics-settings]:focus-visible { outline: 2px solid #9b783b; outline-offset: 3px; }
  .analytics-footer-link { margin-left: .65rem; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .analytics-footer-link[hidden] { display: none; }
  .dark .analytics-notice { border-color: #344052; background: #111a2a; color: #e9e5dc; box-shadow: 0 8px 32px #00000040; }
  .dark .analytics-choice button { border-color: #8190a650; }
  .dark .analytics-choice button:hover { background: #ffffff09; }
  @media (prefers-reduced-motion: no-preference) { .analytics-choice button { transition: background .15s ease; } }
</style>
{{ end }}
